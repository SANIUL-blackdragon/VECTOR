<style>

@keyframes spin{to{transform:rotate(360deg)}}
.fl{stroke-dasharray:3 4;animation:fl .9s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}

 g=E('g',{},s);O(g,lx,ly,'ar');E('line',{x1:lx,y1:ly,x2:lx+62,y2:ly},g,'ln');E('circle',{cx:lx+66,cy:ly,r:5},g,'am');E('circle',{cx:lx,cy:ly,r:4},s,'am')}

mach('m1',T.boilerA,0);
